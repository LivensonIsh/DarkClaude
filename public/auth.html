<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020504"><link rel="icon" href="images/darkgpt-mark.png"><link href="css/css2.css" rel="stylesheet"><link rel="stylesheet" href="css/dc-app.css"><title>Connexion — DarkClaude</title></head><body><header class="dc-top"><a class="dc-logo" href="./index.html">Dark<span>Claude</span></a><nav class="dc-nav"><a href="./pricing.html">Tarifs</a><a href="./contact.html">Contact</a><a href="./demo.html">Chat</a></nav></header>
<main class="dc-wrap"><div class="dc-card dc-narrow">
<h1 id="t">Connexion</h1>
<form id="f" novalidate>
<div id="rowU" hidden><label for="u">Nom d'utilisateur</label><input id="u" autocomplete="username"></div>
<label for="e" id="eL">Email ou nom d'utilisateur</label><input id="e" autocomplete="username" required>
<label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required>
<button class="dc-btn dc-btn--block" id="go" type="submit">Se connecter</button>
</form>
<p class="dc-msg" id="m"></p>
<p class="dc-muted"><a href="#" id="sw">Pas de compte ? Créer un compte</a></p>
</div></main>
<script src="js/dc-common.js"></script>
<script>
let signup = new URLSearchParams(location.search).get("mode") === "signup";
const $ = (i) => document.getElementById(i);
function paint(){ $("t").textContent = signup ? "Créer un compte" : "Connexion"; $("go").textContent = signup ? "Créer mon compte" : "Se connecter";
 $("rowU").hidden = !signup; $("eL").textContent = signup ? "Email" : "Email ou nom d'utilisateur";
 $("p").autocomplete = signup ? "new-password" : "current-password";
 $("sw").textContent = signup ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte"; }
$("sw").onclick = (ev) => { ev.preventDefault(); signup = !signup; paint(); };
$("f").onsubmit = async (ev) => { ev.preventDefault(); $("go").disabled = true; DC.msg($("m"), "");
 try {
  const d = signup ? await DC.api("/api/auth/register", { method: "POST", body: { email: $("e").value, username: $("u").value, password: $("p").value } })
                   : await DC.api("/api/auth/login", { method: "POST", body: { login: $("e").value, password: $("p").value } });
  DC.save(d.token, d.user); location.href = "./demo.html";
 } catch (e) { DC.msg($("m"), e.message); } finally { $("go").disabled = false; } };
paint();
</script></body></html>
