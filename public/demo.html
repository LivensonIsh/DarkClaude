<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020504"><title>Chat — DarkClaude</title><link rel="icon" href="images/darkclaude-mark.png"><link href="css/css2.css" rel="stylesheet"><link rel="stylesheet" href="css/dc-app.css"></head>
<body class="dc-chat">
<header class="dc-top"><a class="dc-logo" href="./index.html">Dark<span>Claude</span></a>
<div class="dc-bar"><span id="plan" class="dc-muted"></span><select id="convSel" aria-label="Conversation" style="max-width:150px"></select><a href="#" id="newConv">+ Nouvelle</a><a href="./pricing.html">Upgrade</a><a href="#" id="clr">Effacer</a><a href="#" id="out">Déconnexion</a></div></header>
<div class="dc-chatlog" id="log"><div class="dc-bubble a">Bienvenue. Je suis DarkClaude. Pose ta question.</div></div>
<form class="dc-compose" id="f">
<div class="dc-bar" style="width:100%"><select id="mode" aria-label="Mode"><option value="nolimit">No Limit</option><option value="code">Code</option><option value="analyse">Analyse</option></select>
<label class="dc-btn dc-btn--ghost" style="padding:6px 12px;margin:0;cursor:pointer">Image<input id="img" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><span id="imgn" class="dc-muted"></span><a href="#" id="imgx" class="dc-muted" style="display:none">✕</a><span id="err" class="dc-msg err" style="margin:0"></span></div>
<textarea id="m" rows="1" placeholder="Écris ton message…" maxlength="4000"></textarea>
<button class="dc-btn" id="go" type="submit">Envoyer</button></form>
<script src="js/api-base.js"></script>
<script src="js/dc-common.js"></script>
<script>
const $ = (i) => document.getElementById(i);
const log = $("log"), history = []; let image = null, busy = false, convId = null;
if (!DC.token()) location.replace("./auth.html?mode=login");
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderMD(raw){
  const blocks=[]; let t=raw.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>{
    const i=blocks.length; blocks.push({lang:(lang||"text"),code:code.replace(/\n$/,"")}); return "\u0000"+i+"\u0000";
  });
  t=escHtml(t);
  t=t.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/(^|\n)(-|\*) (.+)/g,"$1<li>$3</li>");
  t=t.replace(/(<li>.*<\/li>\n?)+/gs,(m)=>"<ul>"+m+"</ul>");
  t=t.split(/\n{2,}/).map(p=>p.trim()?( /^<(ul|li)/.test(p)?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>" ):"").join("");
  t=t.replace(/\u0000(\d+)\u0000/g,(m,i)=>{
    const b=blocks[i]; const id="code"+Math.random().toString(36).slice(2);
    return '<div class="dc-code"><div class="dc-code__bar"><span>'+escHtml(b.lang)+'</span><button class="dc-code__copy" type="button" data-copy-target="'+id+'">Copier</button></div><pre><code id="'+id+'">'+escHtml(b.code)+'</code></pre></div>';
  });
  return t || "";
}
log.addEventListener("click",(ev)=>{
  const cb=ev.target.closest("[data-copy-target]");
  if(cb){ const el=document.getElementById(cb.dataset.copyTarget); if(el){ navigator.clipboard.writeText(el.textContent).then(()=>{const o=cb.textContent;cb.textContent="Copié !";setTimeout(()=>cb.textContent=o,1200);}); } return; }
  const mb=ev.target.closest("[data-copy-msg]");
  if(mb){ navigator.clipboard.writeText(mb.dataset.copyMsg).then(()=>{const o=mb.textContent;mb.textContent="Copié !";setTimeout(()=>mb.textContent="Copier",1200);}); }
});
const bubble = (cls, text) => {
  const d = document.createElement("div"); d.className = "dc-bubble " + cls;
  if (cls === "a") { d.innerHTML = renderMD(text); const c=document.createElement("button"); c.className="dc-bubble__copy"; c.type="button"; c.textContent="Copier"; c.dataset.copyMsg=text; d.appendChild(c); }
  else { d.textContent = text; }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
};
const setBubbleText = (d, text) => {
  d.innerHTML = renderMD(text);
  const c=document.createElement("button"); c.className="dc-bubble__copy"; c.type="button"; c.textContent="Copier"; c.dataset.copyMsg=text; d.appendChild(c);
};

function paintConvSel(rows) {
  $("convSel").innerHTML = rows.map(c => '<option value="' + c.id + '">' + (c.title || "Conversation") + ' · ' + new Date(c.created_at).toLocaleDateString() + '</option>').join("");
  $("convSel").value = convId;
}

async function loadHistory() {
  let rows = [];
  try { rows = (await DC.api("/api/chat/conversations")).conversations; } catch {}
  if (!rows.length) {
    try { const d = await DC.api("/api/chat/conversations", { method: "POST", body: {} }); rows = [{ id: d.id, title: "Conversation", created_at: new Date().toISOString() }]; } catch {}
  }
  convId = rows[0].id;
  paintConvSel(rows);
  await openConversation(convId);
}

async function openConversation(id) {
  convId = id; history.length = 0; log.innerHTML = "";
  try {
    const { messages: rows } = await DC.api("/api/chat/history?conversation_id=" + id);
    if (!rows.length) { bubble("a", "Bienvenue. Je suis DarkClaude. Pose ta question."); return; }
    for (const r of rows) { bubble(r.role === "user" ? "u" : "a", r.content); history.push({ role: r.role, content: r.content }); }
  } catch { bubble("a", "Bienvenue. Je suis DarkClaude. Pose ta question."); }
}

$("convSel").onchange = (e) => openConversation(+e.target.value);

$("newConv").onclick = async (e) => {
  e.preventDefault();
  try {
    const d = await DC.api("/api/chat/conversations", { method: "POST", body: {} });
    const rows = (await DC.api("/api/chat/conversations")).conversations;
    paintConvSel(rows);
    await openConversation(d.id);
  } catch (er) { $("err").textContent = er.message; }
};

async function me() { try { const { user } = await DC.api("/api/auth/me"); localStorage.setItem("darkclaude_user", JSON.stringify(user)); $("plan").textContent = user.plan + " · " + user.dailyLimit + " msg/jour"; if (user.admin && !document.getElementById("adm")) $("plan").insertAdjacentHTML("afterend", ' <a id="adm" href="./admin.html">Admin</a>'); } catch { DC.clear(); location.replace("./auth.html?mode=login"); } }

$("clr").onclick = async (e) => {
  e.preventDefault();
  if (!confirm("Supprimer cette conversation ?")) return;
  try {
    await DC.api("/api/chat/conversations/" + convId, { method: "DELETE" });
    const d = await DC.api("/api/chat/conversations", { method: "POST", body: {} });
    const rows = (await DC.api("/api/chat/conversations")).conversations;
    paintConvSel(rows);
    await openConversation(d.id);
  } catch (er) { $("err").textContent = er.message; }
};
$("out").onclick = async (e) => { e.preventDefault(); try { await DC.api("/api/auth/logout", { method: "POST" }); } catch {} DC.clear(); location.replace("./"); };
$("img").onchange = (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 4 * 1024 * 1024) { $("err").textContent = "Image > 4 Mo"; return; }
  const r = new FileReader(); r.onload = () => { image = { mime: f.type, dataUrl: r.result, name: f.name }; $("imgn").textContent = f.name; $("imgx").style.display = "inline"; }; r.readAsDataURL(f); };
$("imgx").onclick = (e) => { e.preventDefault(); image = null; $("imgn").textContent = ""; $("imgx").style.display = "none"; $("img").value = ""; };
$("m").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); $("f").requestSubmit(); } });
$("m").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px"; });
$("f").onsubmit = async (e) => {
  e.preventDefault(); if (busy) return; const text = $("m").value.trim(); if (!text && !image) return;
  busy = true; $("go").disabled = true; $("err").textContent = "";
  bubble("u", text || "(image)"); $("m").value = ""; $("m").style.height = "auto";
  const out = bubble("a", "…"); let full = "";
  const body = { message: text, mode: $("mode").value, lang: localStorage.getItem("darkclaude_lang") || "fr", stream: true, history: history.slice(-24), conversation_id: convId };
  if (image) body.images = [image];
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "x-session-token": DC.token() }, body: JSON.stringify(body) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); const er = new Error(d.error || "Erreur"); er.status = r.status; throw er; }
    const hdr = r.headers.get("x-conversation-id"); if (hdr) convId = +hdr;
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) { const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!l) continue;
        const j = JSON.parse(l); if (j.error) throw new Error(j.error); if (j.delta) { full += j.delta; setBubbleText(out, full); log.scrollTop = log.scrollHeight; } if (j.upsell) { const u = document.createElement("div"); u.className = "dc-bubble a"; u.innerHTML = "<strong>" + j.upsell.title + "</strong><br>" + j.upsell.body + " <a href=\"" + j.upsell.url + "\">Voir les plans →</a>"; log.appendChild(u); log.scrollTop = log.scrollHeight; } } }
    history.push({ role: "user", content: text }, { role: "assistant", content: full }); image = null; $("imgn").textContent = ""; $("img").value = ""; $("imgx").style.display = "none";
    log.scrollTop = log.scrollHeight;
  } catch (er) { out.remove(); $("err").textContent = er.message; if (er.status === 401) { DC.clear(); location.replace("./auth.html?mode=login"); } if (er.status === 402) $("err").innerHTML = er.message + ' <a href="./pricing.html">Voir les plans</a>'; }
  finally { busy = false; $("go").disabled = false; me(); }
};
loadHistory().then(me);
</script></body></html>
