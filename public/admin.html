<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020504"><link rel="icon" href="images/darkgpt-mark.png"><link href="css/css2.css" rel="stylesheet"><link rel="stylesheet" href="css/dc-app.css"><title>Admin — DarkClaude</title></head><body><header class="dc-top"><a class="dc-logo" href="./index.html">Dark<span>Claude</span></a><nav class="dc-nav"><a href="./pricing.html">Tarifs</a><a href="./contact.html">Contact</a><a href="./demo.html">Chat</a></nav></header>
<main class="dc-wrap"><h1>Paiements en attente</h1><p class="dc-msg" id="m"></p>
<div class="dc-card dc-tablewrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Plan</th><th>Méthode</th><th>Réf.</th><th>HTG</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="js/api-base.js"></script>
<script src="js/dc-common.js"></script>
<script>
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){try{const {payments}=await DC.api("/api/admin/payments");
 document.getElementById("rows").innerHTML=payments.map(p=>'<tr><td>'+p.id+'</td><td>'+esc(p.username)+'<br><span class="dc-muted">'+esc(p.email)+'</span></td><td>'+esc(p.plan)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference)+'</td><td>'+DC.fmt(p.amount_htg)+'</td><td><button class="dc-btn" data-a="approve" data-id="'+p.id+'">Valider</button> <button class="dc-btn dc-btn--ghost" data-a="reject" data-id="'+p.id+'">Refuser</button></td></tr>').join("")||'<tr><td colspan="7" class="dc-muted">Aucun paiement en attente.</td></tr>';}
 catch(e){DC.msg(document.getElementById("m"),e.status===403?"Accès réservé aux admins.":e.message);}}
document.addEventListener("click",async(ev)=>{const b=ev.target.closest("button[data-a]");if(!b)return;b.disabled=true;
 try{await DC.api("/api/admin/payments/"+b.dataset.id+"/"+b.dataset.a,{method:"POST",body:{}});load();}catch(e){DC.msg(document.getElementById("m"),e.message);}});
if(!DC.token())location.href="./auth.html?mode=login";else load();
</script></body></html>
