<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020504"><link rel="icon" href="images/darkclaude-mark.png"><link href="css/css2.css" rel="stylesheet"><link rel="stylesheet" href="css/dc-app.css"><title>Admin — DarkClaude</title></head><body><header class="dc-top"><a class="dc-logo" href="./index.html">Dark<span>Claude</span></a><nav class="dc-nav"><a href="./pricing.html">Tarifs</a><a href="./contact.html">Contact</a><a href="./demo.html">Chat</a></nav></header>
<main class="dc-wrap"><h1>Paiements en attente</h1><p class="dc-msg" id="m"></p>
<div class="dc-card dc-tablewrap"><table><thead><tr><th>#</th><th>Utilisateur</th><th>Plan</th><th>Méthode</th><th>Réf.</th><th>HTG</th><th>Preuve</th><th>Expéditeur</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>

<h1 style="margin-top:36px">Gestion des comptes</h1>
<div class="dc-card dc-narrow" style="max-width:420px">
<label for="search">Rechercher (email ou nom d'utilisateur)</label>
<input id="search" placeholder="ex: milienlivenson44">
<button class="dc-btn dc-btn--block" id="searchBtn" type="button">Rechercher</button>
<p class="dc-msg" id="um"></p>
</div>
<div class="dc-card dc-tablewrap" style="margin-top:14px">
<table><thead><tr><th>Utilisateur</th><th>Plan actuel</th><th>Nouveau plan</th><th>Jours</th><th></th></tr></thead><tbody id="urows"></tbody></table>
</div>
</main>
<script src="js/api-base.js"></script>
<script src="js/dc-common.js"></script>
<script>
(function(){
  if (!DC.token()) { location.replace("./auth.html?mode=login"); return; }
  DC.api("/api/auth/me").then(({user}) => { if (!user.admin) location.replace("./index.html"); }).catch(() => location.replace("./auth.html?mode=login"));
})();
</script>

<script>
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){try{const {payments}=await DC.api("/api/admin/payments");
 document.getElementById("rows").innerHTML=payments.map(p=>'<tr><td>'+p.id+'</td><td>'+esc(p.username)+'<br><span class="dc-muted">'+esc(p.email)+'</span></td><td>'+esc(p.plan)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference)+'</td><td>'+DC.fmt(p.amount_htg)+'</td><td>'+(p.proof_data_url?'<a href="'+p.proof_data_url+'" target="_blank"><img src="'+p.proof_data_url+'" style="width:48px;height:48px;object-fit:cover;border-radius:6px"></a>':'—')+'</td><td>'+esc(p.sender_number||'—')+'<br><span class="dc-muted">'+(p.sender_is_agent?'Agent':'Moi')+'</span></td><td>'+esc(p.notes||'')+'</td><td><button class="dc-btn" data-a="approve" data-id="'+p.id+'">Valider</button> <button class="dc-btn dc-btn--ghost" data-a="reject" data-id="'+p.id+'">Refuser</button></td></tr>').join("")||'<tr><td colspan="10" class="dc-muted">Aucun paiement en attente.</td></tr>';}
 catch(e){DC.msg(document.getElementById("m"),e.status===403?"Accès réservé aux admins.":e.message);}}
document.addEventListener("click",async(ev)=>{const b=ev.target.closest("button[data-a]");if(!b)return;b.disabled=true;
 try{await DC.api("/api/admin/payments/"+b.dataset.id+"/"+b.dataset.a,{method:"POST",body:{}});load();}catch(e){DC.msg(document.getElementById("m"),e.message);}});
load();

const uesc=(x)=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PLANS=["free","starter","unlimited","lifetime"];
async function searchUsers(){
  try{
    const {users}=await DC.api("/api/admin/users?search="+encodeURIComponent(document.getElementById("search").value.trim()));
    document.getElementById("urows").innerHTML=users.map(u=>
      '<tr><td>'+uesc(u.username)+'<br><span class="dc-muted">'+uesc(u.email)+'</span></td>'+
      '<td>'+uesc(u.plan)+(u.is_admin?' · admin':'')+'</td>'+
      '<td><select data-plan-for="'+u.id+'">'+PLANS.map(p=>'<option value="'+p+'"'+(p===u.plan?' selected':'')+'>'+p+'</option>').join("")+'</select></td>'+
      '<td><input type="number" min="1" max="3650" value="365" style="width:80px" data-days-for="'+u.id+'"></td>'+
      '<td><button class="dc-btn" data-apply="'+u.id+'">Appliquer</button></td></tr>'
    ).join("") || '<tr><td colspan="5" class="dc-muted">Aucun utilisateur trouvé.</td></tr>';
  }catch(e){DC.msg(document.getElementById("um"),e.message);}
}
document.getElementById("searchBtn").onclick=searchUsers;
document.getElementById("search").addEventListener("keydown",(e)=>{if(e.key==="Enter")searchUsers();});
document.getElementById("urows").addEventListener("click",async(ev)=>{
  const b=ev.target.closest("button[data-apply]"); if(!b)return;
  const id=b.dataset.apply;
  const plan=document.querySelector('select[data-plan-for="'+id+'"]').value;
  const days=+document.querySelector('input[data-days-for="'+id+'"]').value||365;
  b.disabled=true;
  try{ await DC.api("/api/admin/users/"+id+"/plan",{method:"POST",body:{plan,days}}); DC.msg(document.getElementById("um"),"Plan mis à jour pour l'utilisateur "+id+".",true); }
  catch(e){DC.msg(document.getElementById("um"),e.message);}
  finally{b.disabled=false;}
});
</script></body></html>
