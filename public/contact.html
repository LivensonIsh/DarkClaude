<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020504"><link rel="icon" href="images/darkgpt-mark.png"><link href="css/css2.css" rel="stylesheet"><link rel="stylesheet" href="css/dc-app.css"><title>Contact — DarkClaude</title></head><body><header class="dc-top"><a class="dc-logo" href="./index.html">Dark<span>Claude</span></a><nav class="dc-nav"><a href="./pricing.html">Tarifs</a><a href="./contact.html">Contact</a><a href="./demo.html">Chat</a></nav></header>
<main class="dc-wrap"><div class="dc-card dc-narrow"><h1>Contact</h1>
<form id="f"><label for="n">Nom</label><input id="n"><label for="e">Email</label><input id="e" type="email" required>
<label for="m">Message</label><textarea id="m" rows="5" required></textarea>
<button class="dc-btn dc-btn--block" type="submit">Envoyer</button></form><p class="dc-msg" id="s"></p>
<p class="dc-muted">Support : <a href="https://chat.whatsapp.com/LnuE7yJ0MhX2pPyrdMMbxD">WhatsApp</a> · <a href="https://t.me/+eSmSob1eM6QzNDU0">Telegram</a></p></div></main>
<script src="js/dc-common.js"></script>
<script>document.getElementById("f").onsubmit=async(ev)=>{ev.preventDefault();const s=document.getElementById("s");
try{await DC.api("/api/contact",{method:"POST",body:{name:n.value,email:e.value,message:m.value}});DC.msg(s,"Message envoyé. Merci !",true);ev.target.reset();}catch(x){DC.msg(s,x.message);}};</script></body></html>
